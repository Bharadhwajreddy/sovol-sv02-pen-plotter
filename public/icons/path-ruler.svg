<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Ruler body -->
  <rect x="8" y="24" width="48" height="16" rx="3" fill="url(#rulerGrad)" opacity="0.15" stroke="url(#rulerGrad)" stroke-width="1.5"/>
  <!-- Tick marks -->
  <line x1="16" y1="24" x2="16" y2="30" stroke="url(#rulerGrad)" stroke-width="1.5"/>
  <line x1="24" y1="24" x2="24" y2="28" stroke="url(#rulerGrad)" stroke-width="1"/>
  <line x1="32" y1="24" x2="32" y2="32" stroke="url(#rulerGrad)" stroke-width="1.5"/>
  <line x1="40" y1="24" x2="40" y2="28" stroke="url(#rulerGrad)" stroke-width="1"/>
  <line x1="48" y1="24" x2="48" y2="30" stroke="url(#rulerGrad)" stroke-width="1.5"/>
  <!-- Path line above -->
  <path d="M12 18 Q20 10 32 14 Q44 18 52 12" stroke="url(#rulerGrad)" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="4,2"/>
  <!-- Measurement dots -->
  <circle cx="12" cy="18" r="2.5" fill="url(#rulerGrad)"/>
  <circle cx="52" cy="12" r="2.5" fill="url(#rulerGrad)"/>
</svg>
